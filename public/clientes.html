<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes - AutoTech</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AutoTech | Taller Mecánico</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="clientes.html" class="active">Registro Cliente</a>
            <a href="vehiculos.html">Ingreso Vehículo</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>Formulario de Registro de Cliente</h2>
            <p style="margin-bottom: 1.5rem; color: #64748b;">Complete los 5 campos obligatorios para guardar la información en la base de datos.</p>

            <div id="alertBox" class="alert"></div>

            <form id="clienteForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Carlos Silva">
                </div>

                <div class="form-group">
                    <label for="rut">RUT / Identificación:</label>
                    <input type="text" id="rut" name="rut" required placeholder="Ej: 19876543-2">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="Ej: cliente@correo.cl">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono de Contacto:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej: +56 9 8765 4321">
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" required placeholder="Ej: Av. Costanera 1234">
                </div>

                <button type="submit" class="btn">Guardar Cliente</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('clienteForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = {
                nombre: form.nombre.value,
                rut: form.rut.value,
                email: form.email.value,
                telefono: form.telefono.value,
                direccion: form.direccion.value
            };

            try {
                const res = await fetch('/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const data = await res.json();

                alertBox.style.display = 'block';
                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = data.message;
                    form.reset();
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = data.message || 'Error al guardar los datos.';
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.textContent = 'Hubo un error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
